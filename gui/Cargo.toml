[package]
name = "anima-gui"
version = "0.1.0"
edition = "2024"
description = "Anima settings window"
license = "MIT"

[dependencies]
anima = { path = ".." }
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
toml_edit = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
